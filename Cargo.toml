[workspace]
resolver = "3"
members = [
    "crates/gf_core",
    "crates/gf_content",
    "crates/gf_net",
    "crates/gf_engine",
    "crates/gf_sim",
    "crates/gf_client",
    "crates/gf_game",
    "tools/gf_tools",
]
default-members = ["crates/gf_game"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
# ENGINE PIN — Bevy is named only here and consumed only through `gf_engine`.
# Never chase `main`; bump deliberately and fix fallout inside gf_engine first.
bevy = { version = "=0.20.0-rc.1", default-features = false }

gf_core = { path = "crates/gf_core" }
gf_content = { path = "crates/gf_content" }
gf_net = { path = "crates/gf_net" }
gf_engine = { path = "crates/gf_engine" }
gf_sim = { path = "crates/gf_sim" }
gf_client = { path = "crates/gf_client" }

# glam must match the major line bevy_math uses so `Vec2` is one type across the engine boundary.
glam = { version = "0.33", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
csv = "1.4"
thiserror = "2"
crossbeam-channel = "0.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 16
